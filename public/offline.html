<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2D9E6B" />
    <title>Lytli — Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0fbf6; color: #2c2c2a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 320px; padding: 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 4px 0 0; }
      p { font-size: 15px; line-height: 1.5; color: #4a4a5a; margin: 0; }
      button { margin-top: 8px; border: 0; border-radius: 12px; background: #2d9e6b; color: #fff; font-size: 15px; font-weight: 600; padding: 12px 20px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Lytli" />
      <h1>You&apos;re offline · Você está offline</h1>
      <p>Check your connection and try again. · Verifique sua conexão e tente novamente.</p>
      <button type="button" onclick="location.reload()">Try again · Tentar de novo</button>
    </main>
  </body>
</html>
